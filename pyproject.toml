[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "laplace-demon"
version = "0.1.0"
description = "A clean bootstrap for rebuilding Laplace's Demon module by module."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "sqlalchemy>=2.0",
    "aiogram>=3.4",
    "openai>=1.30",
    "httpx>=0.27,<1",
    "pypdf>=5,<7",
    "python-docx>=1.1,<2",
    "apscheduler>=3.11,<4",
    "pyyaml>=6,<7",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "jinja2>=3.1,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.4",
]

[tool.setuptools.packages.find]
include = ["laplace*"]

[tool.setuptools.package-data]
"laplace.evals" = ["cases/*.yaml", "cases/fixtures/*"]
"laplace.viewer" = ["templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
