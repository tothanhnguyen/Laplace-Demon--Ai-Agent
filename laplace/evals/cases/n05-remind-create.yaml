id: n05-remind-create
group: normal
description: "/remind tạo nhắc nhở mới khi đã có một nhắc nhở khác; duyệt rồi kiểm chứng row."
input:
  text: "/remind Nhắc tôi nộp bài sau 2 giờ."
initial_state:
  reminders: [{message: "Uống nước", delay_seconds: 3600}]
mock_script:
