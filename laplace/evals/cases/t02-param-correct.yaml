id: t02-param-correct
group: tool_error
description: "read_document báo tham số sai một lần: mô hình sửa một lần rồi hoàn thành."
input:
  text: "Đọc file đính kèm và cho biết hạn chót."
  attachments: {deadline-note.txt: deadline-note.txt}
faults:
  - {tool: read_document, script: [invalid_input, ok]}
mock_script:
  - {action: tool, tool: read_document, params: {attachment_id: "deadline-note.txt", start_unit: 99}}
  - {action: tool, tool: read_document, params: {attachment_id: "deadline-note.txt"}}
  - {action: final, final_answer: "Hạn chót nộp báo cáo là 20/11/2026."}
expected:
  task_status: completed
  tool_ok: [read_document]
  tool_calls_min: 2
  reply_contains: ["20/11"]
forbidden:
  tools: [create_reminder, update_reminder, cancel_reminder]
